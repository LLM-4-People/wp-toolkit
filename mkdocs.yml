site_name: wpt
site_description: Audit, clean, optimize, and verify WordPress sites from FTP or an offline zip + SQL dump.
site_url: https://llm-4-people.github.io/wp-toolkit/
repo_url: https://github.com/LLM-4-People/wp-toolkit
repo_name: LLM-4-People/wp-toolkit
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 The wpt authors

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Commands: commands.md
  - Safety: safety.md
  - Architecture: architecture.md
  - Development: development.md
  - FAQ: faq.md
  - Research:
      - "R1 — DNS override": research/R1.md
      - "R2 — Bridge internals": research/R2.md
      - "R3 — WordPress update APIs": research/R3.md
      - "R4 — SQL dump parser": research/R4.md
  - Changelog: https://github.com/LLM-4-People/wp-toolkit/blob/main/CHANGELOG.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: en

extra_css:
  - assets/extra.css

extra:
  generator: false

strict: true
