[build-system]
requires = ["setuptools>=77", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "wpt"
version = "0.1.0"
description = "Audit, clean, optimize, and verify WordPress sites from FTP or an offline zip + SQL dump"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "The wpt authors"}]
keywords = [
    "wordpress",
    "cli",
    "audit",
    "security",
    "backup",
    "migration",
    "ftp",
    "devops",
    "site-reliability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests>=2.32.2,<3",
    "urllib3>=2.7,<3",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8,<4",
    "pytest-timeout>=2.3,<3",
    "build>=1.2",
    "setuptools>=77",
    "wheel>=0.43,<1",
    "PySocks>=1.7.1,<2",
    "ruff>=0.17,<1",
    "twine>=7,<8",
    "vulture>=2.16,<3",
]
# Pure-Python MySQL/MariaDB driver: only --db-uri (offline clean-db/doctor)
# and the re-dump writer need it. [rsa] = MySQL 8's caching_sha2_password.
db = ["PyMySQL[rsa]>=1.2,<2"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "pymdown-extensions>=12.3,<13",
]

[project.scripts]
wpt = "wpt.cli:main"

[project.urls]
Homepage = "https://github.com/LLM-4-People/wp-toolkit"
Documentation = "https://llm-4-people.github.io/wp-toolkit/"
Repository = "https://github.com/LLM-4-People/wp-toolkit"
Issues = "https://github.com/LLM-4-People/wp-toolkit/issues"
Changelog = "https://github.com/LLM-4-People/wp-toolkit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["wpt*"]

[tool.setuptools.package-data]
wpt = ["data/profiles/default.json", "*.php"]
"wpt.wpbridge" = ["*.php"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# A wedged test must fail in bounded time instead of consuming the job's
# entire timeout; this is a test-runner safety bound, not a product tunable.
timeout = 180

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist", "site"]

[tool.ruff.lint]
# Keep the long-standing default rule set explicit.  Newer ruff
# releases add rules to their default selection; a lint result must
# not change because the tool upgraded underneath the project.
select = ["E4", "E7", "E9", "F"]
