name: Feature request
description: Propose a capability or workflow improvement.
title: "[feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational problem are you trying to solve?
      placeholder: Describe the workflow that is currently unsafe, slow, or missing.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should wpt do? Include the command shape and safety model if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing commands, scripts, or workflows you tried.

  - type: textarea
    id: scope
    attributes:
      label: Scope and compatibility
      description: Does this affect FTP, local mode, the bridge, reports, or packaging?
      placeholder: "Example: local mode first; FTP support can follow."

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This proposal does not require committing client data or credentials.
          required: true
